name: Push 9hits Image to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull Original Image
        run: docker pull 9hitste/appv6:latest

      - name: Tag Image as backend
        run: docker tag 9hitste/appv6:latest ${{ secrets.DOCKER_USERNAME }}/backend:latest

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest
        
